<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Glassmark</title>
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="social.css" />
  </head>
  <body>
    <div class="desktop-scene" aria-hidden="true"></div>
    <div id="app">
      <aside id="sidebar">
        <div class="sidebar-top">
          <div class="traffic window-drag-handle">
            <button
              id="window-close"
              title="关闭窗口"
              aria-label="关闭窗口"
              data-i18n-title="关闭窗口"
              data-i18n-aria-label="关闭窗口"
            >
              <span aria-hidden="true">×</span></button
            ><button
              id="window-minimize"
              title="最小化"
              aria-label="最小化"
              data-i18n-title="最小化"
              data-i18n-aria-label="最小化"
            >
              <span aria-hidden="true">−</span></button
            ><button
              id="window-maximize"
              title="缩放窗口"
              aria-label="缩放窗口"
              data-i18n-title="缩放窗口"
              data-i18n-aria-label="缩放窗口"
            >
              <span aria-hidden="true">↗</span>
            </button>
          </div>
          <div class="identity window-drag-handle">
            <span class="mark"><span data-icon="logo"></span></span>
            <div>
              Glassmark<small data-i18n="留住值得回看的网页"
                >留住值得回看的网页</small
              >
            </div>
            <button
              id="settings"
              class="icon-button"
              title="连接与同步"
              aria-label="连接与同步"
              data-i18n-title="连接与同步"
              data-i18n-aria-label="连接与同步"
            >
              <span data-icon="settings"></span>
            </button>
          </div>
          <label class="search"
            ><span><span data-icon="search"></span></span
            ><input
              id="search"
              type="search"
              aria-label="全局搜索"
              data-i18n-aria-label="全局搜索"
              placeholder="搜索收藏"
              autocomplete="off"
              data-i18n-placeholder="搜索收藏"
            /><kbd>⌘ K</kbd></label
          >
          <nav
            id="platforms"
            aria-label="资料来源"
            data-i18n-aria-label="资料来源"
          >
            <div id="social-platforms"></div>
            <div class="web-root-row">
              <button
                id="web-root-button"
                data-view="web"
                class="platform-entry"
              ></button
              ><button
                id="new-folder"
                class="icon-button"
                title="在网页中新建文件夹"
                aria-label="新建文件夹"
                data-i18n-title="在网页中新建文件夹"
                data-i18n-aria-label="新建文件夹"
              >
                <span data-icon="plus"></span>
              </button>
            </div>
            <nav
              id="folders"
              aria-label="网页文件夹"
              data-i18n-aria-label="网页文件夹"
            ></nav>
          </nav>
          <button
            id="global-results-back"
            class="text-button"
            hidden
            data-i18n="查看全局搜索结果"
          >
            查看全局搜索结果
          </button>
          <div id="tags" class="tag-filters"></div>
        </div>
        <div class="sidebar-footer">
          <span id="connection-dot" class="dot"></span
          ><span id="connection-status" data-i18n="正在连接…">正在连接…</span
          ><button
            id="sync-button"
            class="icon-button"
            title="立即同步"
            aria-label="立即同步"
            data-i18n-title="立即同步"
            data-i18n-aria-label="立即同步"
          >
            <span data-icon="refresh"></span>
          </button>
        </div>
      </aside>
      <main id="main">
        <div
          class="window-titlebar window-drag-handle"
          aria-label="拖动窗口"
          data-i18n-aria-label="拖动窗口"
        ></div>
        <header id="toolbar" class="window-drag-handle">
          <div class="breadcrumb">
            <span data-i18n="资料库">资料库</span><span>／</span
            ><span id="breadcrumb-current" data-i18n="全部网页">全部网页</span>
          </div>
          <div id="page-metadata" class="page-metadata" hidden></div>
          <div
            id="page-zoom"
            class="page-zoom"
            role="group"
            aria-label="网页缩放"
            data-i18n-aria-label="网页缩放"
            hidden
          >
            <button
              id="page-zoom-out"
              type="button"
              aria-label="缩小网页"
              data-i18n-aria-label="缩小网页"
              title="缩小网页"
              data-i18n-title="缩小网页"
            >
              −
            </button>
            <select
              id="page-zoom-value"
              aria-label="网页缩放比例"
              data-i18n-aria-label="网页缩放比例"
            >
              <option value="50">50%</option>
              <option value="67">67%</option>
              <option value="75">75%</option>
              <option value="80">80%</option>
              <option value="90">90%</option>
              <option value="100" selected>100%</option>
              <option value="110">110%</option>
              <option value="125">125%</option>
              <option value="150">150%</option>
              <option value="175">175%</option>
              <option value="200">200%</option>
            </select>
            <button
              id="page-zoom-in"
              type="button"
              aria-label="放大网页"
              data-i18n-aria-label="放大网页"
              title="放大网页"
              data-i18n-title="放大网页"
            >
              +
            </button>
          </div>
          <div class="toolbar-actions">
            <button
              id="move"
              class="icon-button"
              title="移动到文件夹"
              aria-label="移动到文件夹"
              data-i18n-title="移动到文件夹"
              data-i18n-aria-label="移动到文件夹"
            >
              <span data-icon="move"></span></button
            ><button
              id="tag-button"
              class="icon-button"
              title="编辑标签"
              aria-label="编辑标签"
              data-i18n-title="编辑标签"
              data-i18n-aria-label="编辑标签"
            >
              <span data-icon="tag"></span></button
            ><button
              id="info"
              class="icon-button"
              title="归档详情"
              aria-label="归档详情"
              data-i18n-title="归档详情"
              data-i18n-aria-label="归档详情"
            >
              <span data-icon="info"></span></button
            ><button
              id="delete"
              class="icon-button"
              title="删除收藏"
              aria-label="删除收藏"
              data-i18n-title="删除收藏"
              data-i18n-aria-label="删除收藏"
            >
              <span data-icon="trash"></span>
            </button>
          </div>
        </header>
        <div id="reader"></div>
      </main>
    </div>
    <dialog id="dialog" aria-labelledby="dialog-title">
      <form method="dialog" novalidate>
        <div class="dialog-header">
          <h2 id="dialog-title" tabindex="-1"></h2>
          <button
            class="icon-button"
            type="button"
            id="dialog-close"
            value="cancel"
            aria-label="关闭"
            data-i18n-aria-label="关闭"
          >
            <span data-icon="close"></span>
          </button>
        </div>
        <div id="dialog-body"></div>
        <div class="dialog-actions" id="dialog-actions"></div>
      </form>
    </dialog>
    <div id="toast" role="status"></div>
    <script type="module" src="bootstrap.js"></script>
  </body>
</html>

name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  web-and-native:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core -> target
          cache-workspace-crates: true
          cache-on-failure: true
          shared-key: core-tests
      - run: npm ci
      - run: npm run check && npm test && npm run build
      - run: cargo test --locked --manifest-path core/Cargo.toml
      - run: cargo clippy --locked --manifest-path core/Cargo.toml --all-targets -- -D warnings
      - run: cargo build --locked --manifest-path core/Cargo.toml --bin glassmark-bridge
      - name: Cache browser binaries
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: browsers-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: browsers-${{ runner.os }}-
      - run: npx playwright install --with-deps chromium firefox
      - run: node tests/extension.e2e.mjs
        env:
          GLASSMARK_BRIDGE_BIN: core/target/debug/glassmark-bridge
      - run: npm run test:e2e
        env:
          GLASSMARK_BRIDGE_BIN: core/target/debug/glassmark-bridge
      - run: node tests/firefox.e2e.mjs
      - name: Install pinned Firefox WebDriver
        run: |
          curl --fail --location --retry 2 -o /tmp/geckodriver.tar.gz https://github.com/mozilla/geckodriver/releases/download/v0.37.1/geckodriver-v0.37.1-linux64.tar.gz
          echo 'e815130ea95983e162ae91843b48d3a3ce991735635fce83a647afde21e09f7e  /tmp/geckodriver.tar.gz' | sha256sum --check
          tar -xzf /tmp/geckodriver.tar.gz -C /tmp geckodriver
      - name: Installed Firefox add-on and native persistence
        run: node tests/firefox-extension.e2e.mjs
        env:
          GECKODRIVER_BIN: /tmp/geckodriver
          GLASSMARK_BRIDGE_BIN: core/target/debug/glassmark-bridge
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports-and-extensions
          path: |
            artifacts/
            dist/glassmark-*.zip
            core/Cargo.lock
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux-x64
            target: x86_64-unknown-linux-gnu
            rust-targets: x86_64-unknown-linux-gnu
            bundles: deb,appimage,rpm
          - os: windows-latest
            platform: windows-x64
            target: x86_64-pc-windows-msvc
            rust-targets: x86_64-pc-windows-msvc
            bundles: nsis,msi
          - os: macos-latest
            platform: macos-universal
            target: universal-apple-darwin
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
            bundles: dmg
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          cache-workspace-crates: true
          cache-on-failure: true
          shared-key: desktop-${{ matrix.platform }}
      - name: Cache native bundler tools
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/tauri
            ~/Library/Caches/tauri
            ~/AppData/Local/tauri
          key: bundler-${{ matrix.platform }}-${{ hashFiles('src-tauri/tauri.conf.json', 'package-lock.json') }}
          restore-keys: bundler-${{ matrix.platform }}-
      - name: Linux desktop dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libxdo-dev libssl-dev librsvg2-dev libayatana-appindicator3-dev patchelf rpm
      - run: npm ci
      - run: cargo metadata --locked --no-deps --manifest-path src-tauri/Cargo.toml
      - name: Build native installers
        run: npm run tauri -- build --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
      - name: Build and validate Arch Linux package
        if: runner.os == 'Linux'
        run: bash scripts/package-arch.sh
      - name: Inspect Linux package metadata and payloads
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          for package in src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/deb/*.deb; do
            dpkg-deb --info "$package"
            dpkg-deb --contents "$package"
          done
          for package in src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/rpm/*.rpm; do
            rpm -qpi "$package"
            rpm -qpl "$package" | grep -q '/usr/bin/glassmark$'
            rpm -qpR "$package"
          done
      - name: Verify RPM dependencies on Fedora
        if: runner.os == 'Linux'
        shell: bash
        run: |
          docker run --rm -v "$PWD/src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/rpm:/packages:ro" fedora:latest bash -euc '
            dnf install -y /packages/*.rpm
            rpm -q glassmark
            test -x /usr/bin/glassmark
            if ldd /usr/bin/glassmark | grep "not found"; then exit 1; fi
          '
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.platform }}
          if-no-files-found: error
          path: |
            src-tauri/target/**/release/bundle/**/*.dmg
            src-tauri/target/**/release/bundle/**/*.msi
            src-tauri/target/**/release/bundle/**/*.exe
            src-tauri/target/**/release/bundle/**/*.deb
            src-tauri/target/**/release/bundle/**/*.AppImage
            src-tauri/target/**/release/bundle/**/*.rpm
            dist/linux/*.pkg.tar.zst

    <script>
      const inline = document.querySelector("#inline-comments");
      const params = new URL(location.href).searchParams;
      const primary = document.querySelector(".ContentItem-actions button");
      const all = inline.querySelector(".css-wu78cf");
      const opened = params.has("opened");
      inline.hidden = !opened && !params.has("preview");
      all.hidden = !opened;
      primary.textContent = opened ? "收起评论" : "162 条评论";
      primary.setAttribute("aria-expanded", String(opened));
      const preview = inline.querySelector(".preview-list");
      function stagedLoading() {
        // First body, remaining bodies and the all-comments control render separately.
        preview.querySelector('[data-id="c2"]').hidden = true;
        all.hidden = true;
        document.body.dataset.firstBodyAt = String(performance.now());
        setTimeout(() => {
          preview.querySelector('[data-id="c2"]').hidden = false;
        }, 1800);
        setTimeout(() => {
          all.hidden = false;
          document.body.dataset.controlsReady = "1";
        }, 2500);
      }
      function finishLoading() {
        inline.hidden = false;
        inline.removeAttribute("aria-busy");
        inline.querySelector("[data-pending-comment]")?.remove();
        preview.hidden = false;
        all.hidden = false;
        primary.textContent = "收起评论";
        primary.setAttribute("aria-expanded", "true");
        document.body.dataset.commentsLoaded = "1";
      }
      function beginLoading() {
        inline.hidden = false;
        inline.setAttribute("aria-busy", "true");
        preview.hidden = true;
        all.hidden = true;
        primary.textContent = "收起评论";
        primary.setAttribute("aria-expanded", "true");
        const pending = document.createElement("div");
        pending.setAttribute("data-pending-comment", "");
        pending.innerHTML =
          '<span role="status">正在加载评论</span><div hidden>暂无评论</div>' +
          (params.has("skeleton")
            ? '<div class="CommentItemV2" data-comment-id="pending"><span>作者占位</span><div class="CommentContent" style="min-height:20px"></div></div>'
            : "");
        inline.prepend(pending);
        if (!params.has("blocked"))
          setTimeout(finishLoading, Number(params.get("delay") || 1200));
      }
      if (opened && params.has("skeleton")) beginLoading();
      primary.onclick = () => {
        document.body.dataset.commentClicks = String(
          Number(document.body.dataset.commentClicks || 0) + 1,
        );
        if (params.has("skeleton") || params.has("staleempty")) {
          beginLoading();
          return;
        }
        if (params.has("blocked")) return;
        setTimeout(
          () => {
            inline.hidden = false;
            all.hidden = false;
            primary.textContent = "收起评论";
            primary.setAttribute("aria-expanded", "true");
            if (params.has("staged")) stagedLoading();
            if (params.has("unstable")) {
              let revision = 0;
              setInterval(() => {
                preview.querySelector(".CommentContent").textContent =
                  "尚在更新的评论 " + ++revision;
              }, 600);
            }
          },
          Number(params.get("delay") || 250),
        );
      };

      if (params.has("adsonly"))
        for (const row of preview.querySelectorAll("[data-id]"))
          row.setAttribute("data-ad", "true");
      const rowTemplate = document.querySelector("[data-id=c1]").outerHTML;
      function row(id, text) {
        const holder = document.createElement("div");
        holder.innerHTML = rowTemplate;
        const node = holder.firstElementChild;
        node.dataset.id = id;
        node.querySelector(".css-7dh30y")?.remove();
        node.querySelector(".CommentContent").textContent = text;
        return node;
      }
      document.querySelector(".css-wu78cf").onclick = () => {
        document.body.dataset.allCommentClicks = String(
          Number(document.body.dataset.allCommentClicks || 0) + 1,
        );
        const modal = document.createElement("div");
        modal.className = "Modal";
        modal.setAttribute("role", "dialog");
        modal.innerHTML =
          '<div class="Comments-container"><div id="full-list"></div><button id="next">下一页</button></div>';
        // The initial full-comment page deliberately repeats exactly the same comments.
        modal.querySelector("#full-list").innerHTML =
          document.querySelector(".preview-list").innerHTML;
        inline.hidden = true;
        document.body.append(modal);
        const first = modal.querySelector("[data-id=c1]");
        const replies = first.querySelector(".css-7dh30y");
        replies.onclick = () => {
          document.body.dataset.replyClicks = "1";
          for (let i = 1; i <= 3; i++)
            first.append(row("reply" + i, "嵌套回复" + i));
          replies.remove();
        };
        modal.querySelector("#next").onclick = (event) => {
          const list = modal.querySelector("#full-list");
          if (params.has("pageDelay")) {
            list.setAttribute("aria-busy", "true");
            list.innerHTML =
              '<div class="CommentItemV2" data-comment-id="pending-page"><div class="CommentContent" style="min-height:20px"></div></div>';
            setTimeout(
              () => {
                list.removeAttribute("aria-busy");
                list.replaceChildren(row("c3", "完整评论区下一页"));
              },
              Number(params.get("pageDelay")),
            );
          } else list.append(row("c3", "完整评论区下一页"));
          event.target.disabled = true;
        };
      };
    </script>

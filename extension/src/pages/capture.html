<!doctype html>
<html lang="zh-CN">
  <meta charset="utf-8" /><meta
    name="viewport"
    content="width=device-width,initial-scale=1"
  /><link rel="stylesheet" href="extension.css" /><title>
    Glassmark · 收藏
  </title>
  <body class="capture">
    <main>
      <div class="brand">◈ Glassmark</div>
      <p class="eyebrow">CAPTURE A MOMENT</p>
      <h1 id="title">准备保存这份灵感</h1>
      <p id="detail">正在确认客户端连接…</p>
      <progress id="progress"></progress>
      <p id="stats" class="muted"></p>
      <div id="limit" hidden>
        <p>此次下载将超过当前上限。是否再允许下载 500 MB？</p>
        <button id="approve">继续下载</button
        ><button class="secondary" id="skip">跳过超限资源</button>
      </div>
      <div class="actions">
        <button id="cancel" class="secondary">取消收藏</button
        ><button id="more" hidden>继续收集下一批 100 条（新增收藏）</button>
      </div>
      <details id="report" hidden>
        <summary>查看保存范围与资源报告</summary>
        <pre id="warnings"></pre>
      </details>
      <p class="muted">请保持此页打开，直到发送完成。来源网页仍可正常使用。</p>
    </main>
    <script type="module" src="pages/capture.js"></script>
  </body>
</html>

<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <link rel="stylesheet" href="extension.css" />
    <title>Glassmark · 收藏</title>
  </head>
  <body class="popup">
    <header class="popup-header">
      <div class="brand"><span data-icon="logo"></span>Glassmark</div>
      <span class="connection-badge" id="connection-badge">检查连接</span>
    </header>
    <p id="status" role="status" aria-live="polite">正在连接客户端…</p>
    <section id="pair" hidden>
      <div class="pair-heading">
        <span data-icon="link"></span>
        <div>
          <h2>连接 Glassmark</h2>
          <small>浏览器与客户端安全配对</small>
        </div>
      </div>
      <p class="muted">
        打开客户端「设置 → 浏览器连接」，复制配对码并粘贴到下方。
      </p>
      <label
        >配对码<input
          id="code"
          inputmode="numeric"
          autocomplete="one-time-code"
          placeholder="000000"
          maxlength="6" /></label
      ><button id="pairButton">连接客户端</button>
    </section>
    <section class="page-context" id="page-context">
      <div class="context-icon" id="context-icon">
        <span data-icon="globe"></span>
      </div>
      <div>
        <small id="page-kind">当前网页</small
        ><strong id="page-title">读取当前标签页…</strong
        ><span id="page-host"></span>
      </div>
    </section>
    <section id="actions" hidden>
      <div class="save-destination">
        <label id="folder-field"
          >保存位置<select id="destination-folder">
            <option value="">网页 · 根文件夹</option>
          </select></label
        >
        <fieldset id="tags-field">
          <legend>标签（可多选）</legend>
          <div id="destination-tags" class="popup-tag-choices"></div>
          <small>在客户端管理此来源的标签</small>
        </fieldset>
      </div>
      <button data-mode="thread" id="save-post">
        <span data-icon="bookmark"></span
        ><span id="save-post-label">保存当前帖子与讨论</span>
      </button>
      <button data-mode="page" id="save-page">
        <span data-icon="globe"></span>保存整个网页
      </button>
      <button data-mode="selection" class="secondary selection-action">
        <span data-icon="pointer"></span>选择网页中的多个区域<span
          class="action-key"
          >↗</span
        >
      </button>
    </section>
    <footer class="popup-footer">
      <span>你的内容，留在你的电脑</span>
      <details id="connection-settings">
        <summary>
          <span data-icon="settings"></span>连接设置<span
            class="connection-chevron"
            >⌄</span
          >
        </summary>
        <p class="muted">客户端需保持运行，收藏会自动保存到本机。</p>
        <button class="secondary" id="retry-connection">重新检查连接</button
        ><button class="secondary" id="disconnect">断开配对</button>
      </details>
    </footer>
    <script type="module" src="pages/popup.js"></script>
  </body>
</html>
